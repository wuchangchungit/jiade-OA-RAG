# =============================================================================
# Nginx 反向代理配置示例（HTTPS + FastAPI）
#
# 使用前提：
#   1. FastAPI 运行在本机或内网：127.0.0.1:8000
#   2. 已按 SSL_SETUP.md 生成证书，放在 ./ssl/ 目录
#   3. 将 server_name 替换为实际域名或本机名
#
# 启动示例（Linux / 容器内）：
#   nginx -c /path/to/nginx.conf
# 或在 docker 中挂载本目录：
#   -v ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#   -v ./nginx/ssl:/etc/nginx/ssl:ro
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 50m;   # 允许上传较大文档

    # -----------------------------
    # HTTP：强制跳转到 HTTPS
    # -----------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;   # 请改为实际域名，如 rag.example.com

        # ACME / 健康检查可按需放开；默认全部跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------
    # HTTPS：反向代理到 FastAPI
    # -----------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;   # 请改为实际域名

        # ----- SSL 证书（手工自签发或正式证书）-----
        # 证书与私钥路径相对于容器内 /etc/nginx，或本机绝对路径
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # 推荐 TLS 参数（兼容现代浏览器）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全相关响应头（可按环境调整）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # 上游 FastAPI（uvicorn）
        # 若 Nginx 与 FastAPI 同机：127.0.0.1:8000
        # 若在 docker compose 网络中：可改为 http://host.docker.internal:8000 或服务名
        set $upstream_fastapi http://127.0.0.1:8000;

        # ----- 静态资源可直接回源 FastAPI（已由应用挂载 /static）-----
        location /static/ {
            proxy_pass $upstream_fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
        }

        # ----- SSE 流式对话：必须关闭缓冲、拉长超时 -----
        location /api/v1/chat/stream {
            proxy_pass $upstream_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE 关键：禁止代理缓冲，避免打字机效果被攒批
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # 长连接超时（按业务调整）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----- 其余 API 与页面统一反代 -----
        location / {
            proxy_pass $upstream_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}